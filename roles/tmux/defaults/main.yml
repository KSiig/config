---
tmux_name: tmux

repo_dest: "{{ ansible_env.HOME }}/.tmux"
repo_clone_url: "https://github.com/gpakosz/.tmux.git"
repo_version: "master"

tmux_conf_src: "{{ ansible_env.HOME }}/.tmux/.tmux.conf"
tmux_conf_dest: "{{ ansible_env.HOME }}/.tmux.conf"
tmux_conf_local_src: "{{ playbook_dir }}/roles/tmux/files/.tmux.conf.local"

# OSC 52 clipboard helper that .tmux.conf.local's copy bindings pipe through
clip_src: "{{ playbook_dir }}/roles/tmux/files/clip"
clip_dest: "{{ ansible_env.HOME }}/.local/bin/clip"
