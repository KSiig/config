---
- name: Update apt cache (Debian-family)
  apt:
    update_cache: true
  become: true
  when: ansible_os_family == "Debian"

- name: Install basic packages
  package:
    name: "{{ basic_packages }}"
    state: present
  become: "{{ ansible_os_family != 'Darwin' }}"
  # On MacPorts the macos role installs these with the other ports.
  when: not use_macports
