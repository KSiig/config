---
- name: Update apt cache (Debian-family)
  apt:
    update_cache: true
  become: true
  when: ansible_os_family == "Debian"

- name: Install Git
  package:
    name: "git"
    state: present
  become: "{{ ansible_os_family != 'Darwin' }}"
  when: not use_macports

- name: Install Tmux
  package:
    name: "{{ tmux_name }}"
    state: present
  become: "{{ ansible_os_family != 'Darwin' }}"
  when: not use_macports

- name: Check if folder exists
  stat:
    path: "{{ repo_dest }}"
  register: file_details

- name: Clone Tmux Config
  git:
    repo: "{{ repo_clone_url }}"
    dest: "{{ repo_dest }}"
    version: "{{ repo_version }}"
  when: not file_details.stat.exists

- name: Create symlink to .tmux.conf
  file:
    src: "{{ tmux_conf_src }}"
    dest: "{{ tmux_conf_dest }}"
    state: link

- name: Create symlink to .tmux.conf.local
  file:
    src: "{{ tmux_conf_local_src }}"
    dest: "{{ tmux_conf_dest }}.local"
    state: link
    force: true

- name: Ensure local bin directory exists
  file:
    path: "{{ clip_dest | dirname }}"
    state: directory
    mode: "0755"

- name: Create symlink to clip
  file:
    src: "{{ clip_src }}"
    dest: "{{ clip_dest }}"
    state: link
    force: true

- name: Check whether agent-deck is installed
  stat:
    path: "{{ agent_deck_dest }}/agent-deck"
  register: agent_deck_bin

- name: Install agent-deck from its release build
  unarchive:
    src: "{{ agent_deck_url }}"
    dest: "{{ agent_deck_dest }}"
    remote_src: true
    include:
      - agent-deck
    mode: "0755"
  when: not agent_deck_bin.stat.exists
